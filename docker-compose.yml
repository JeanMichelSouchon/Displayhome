
services:

  backend:
    build: ./backend
    image: eu.gcr.io/thehomedisplay/backend
    ports:
      - "3000:3000"
    environment:
      DB_HOST: /cloudsql/thehomedisplay:europe-west1:thehomedisplay
      DB_USER: myuser
      DB_PASSWORD: mypassword
      DB_NAME: iddlesaur
      JWT_SECRET: mySuperSecretKey
      DEFAULT_ADMIN_NAME: admin
      DEFAULT_ADMIN_PASSWORD: password
    networks:
      - backend-network

  frontend:
    build: ./frontend
    image: eu.gcr.io/thehomedisplay/frontend
    ports:
      - "8080:80"
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge
