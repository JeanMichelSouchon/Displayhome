<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Connexion / Inscription</title>
  <link rel="stylesheet" href="stylesauth.css" />
</head>
<body>
  <div class="container">

    <h1>Bienvenue</h1>

    <!-- Connexion -->
    <div class="form-container">
      <h2>Connexion</h2>
      <form id="login-form">
        <input type="email" id="login-email" placeholder="Email" required />
        <input type="password" id="login-password" placeholder="Mot de passe" required />
        <button type="submit">Se connecter</button>
      </form>
    </div>

    <!-- Inscription -->
    <div class="form-container">
      <h2>Inscription</h2>
      <form id="signup-form">
        <input type="text" id="signup-username" placeholder="Nom d'utilisateur" required />
        <input type="email" id="signup-email" placeholder="Email" required />
        <input type="password" id="signup-password" placeholder="Mot de passe" required />
        <button type="submit">S'inscrire</button>
      </form>
    </div>

  </div>

  <script src="scriptauth.js"></script>
</body>
</html>
