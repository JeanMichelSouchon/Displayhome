<!DOCTYPE html>
<html lang="fr">
<head>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Vitrine</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="window-controls">
        <div id="window-title">Home Display</div>
        <div id="window-buttons">
          <button id="min-btn">–</button>
          <button id="max-btn">□</button>
          <button id="close-btn">×</button>
        </div>
      </div>
      
      
    <div id="container">
        <div id="time-container">
            <div id="time-overlay">00:00:00</div>
            <div id="diconnect"><button >Disconnect</button></div>
        </div>

        <!-- Planète en 3D -->
        <div id="planet-container">

            <canvas id="planet"></canvas>
        </div>
        <div id="shape-buttons">
            <button id="sphere-btn">Sphere</button>
            <button id="cube-btn">Cube</button>
            <button id="triangle-btn">Triangle</button>
        </div>
        
        <!-- Widget radio à gauche -->
        <div id="radio-widget">
            
            <iframe src='https://tunein.com/embed/player/s2339/'; style='width:100%; height:100px'; scrolling='no'; frameborder='no';></iframe>
            <iframe src='https://tunein.com/embed/player/s210993/' style='width:100%; height:100px;'; scrolling='no' frameborder='no'></iframe>
            <iframe src='https://tunein.com/embed/player/s111622/' style='width:100%; height:100px;' scrolling='no' frameborder='no'></iframe>
            
            <!-- Section de prise de notes -->
            <div id="note-section">
                <h4>Prise de Notes</h4>
                <div id="note-message" class="message"></div>
                <textarea id="note-area" placeholder="Écrivez vos notes ici..."></textarea>
                <button id="save-note">Enregistrer</button>
                
                <!-- Section pour afficher les notes enregistrées -->
                <div id="saved-notes">
                    <h4>Notes enregistrées :</h4>
                    <div id="no-notes-message">Aucun message à afficher</div>
                    <ul id="notes-list"></ul>
                </div>
            </div>
        </div>

        <!-- Actualités à droite -->
        <div id="news">
            <h3>Actualités Jeux Vidéo</h3>
            <div id="rss-feed" style="padding: 10px; color: white; overflow-y: hidden;"></div>

        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
